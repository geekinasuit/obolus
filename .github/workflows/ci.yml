name: CI

on:
  push:
    branches: [main]
  pull_request:

# This repository is public, so pull requests carry code from people we do not know. Every job
# below runs on a GitHub-hosted runner — never a self-hosted one, which would execute a stranger's
# patch on our own hardware — and the token is read-only.
permissions:
  contents: read

jobs:
  no-stray-notes:
    name: No working notes in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Content that cannot be a public issue — session handoffs and the like — is kept outside this
      # repository. .gitignore keeps it out by default; this job is what makes that load-bearing,
      # since an ignore rule is silently defeated by `git add -f`.
      - name: Reject committed notes
        run: |
          if git ls-files | grep -E '(^|/)thoughts/'; then
            echo "::error::Working notes must not be committed to this repository."
            exit 1
          fi
          echo "No note files tracked."

      # The subtler case: a path that is not in this repository but is still linked to. Such a link
      # is a broken reference for anyone reading the code. Two prefixes are checked, both from the
      # layout this code was exported from: `thoughts/`, the untracked notes directory, and
      # `serving/`, the monorepo subtree the crates lived under. A deny-list of known prefixes
      # rather than a general absent-path check, deliberately: deciding what counts as a path in
      # arbitrary prose, and which of those are legitimately external, is a harder problem than the
      # realistic failure — exported content still carrying its old paths — calls for (#10). Each
      # prefix covers its whole directory rather than one subtree, requires a character after the
      # slash so that naming the directory itself — as AGENTS.md does — stays allowed, and requires
      # a non-identifier character before it so that a word merely ending in the prefix
      # (`preserving/`) does not match. It is a reference *into* one of them that breaks.
      - name: Reject references to absent paths
        run: |
          if git grep -nE '(^|[^A-Za-z0-9_.-])(thoughts|serving)/[A-Za-z0-9_.-]' -- . ':!.github/workflows/ci.yml' ':!.gitignore'; then
            echo "::error::Source refers to a path that is not in this repository. If the file lives here under another path, name that path; if it is a working note, cite the GitHub issue instead — AGENTS.md gives the citation form for the kind of file you are in — or drop the reference entirely; content that cannot be public does not become an issue."
            exit 1
          fi
          echo "No references to absent paths."

  bazel:
    name: bazel test //...
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # AGENTS.md's invariant that `eip3009` is not a dependency of the gateway binary. Two places
      # said so in prose and nothing checked it: a `deps` entry compiles clean and passes every gate,
      # which is how the gateway would acquire a signature verifier without anyone deciding to give
      # it one. Before the test step, so a violation costs seconds rather than a suite. Not repeated
      # in the macOS job: the dependency graph does not vary by platform.
      #
      # The pass condition is empty output, not exit status. `somepath` exits 0 and prints nothing
      # when there is no path — but it also exits non-zero for a query it could not load at all, and
      # a mistyped label must fail loudly rather than read as clean. This is the Bazel half; the
      # cargo job below carries the other, and both must hold.
      - name: eip3009 is not a gateway dependency
        run: |
          if ! bazel query 'somepath(//obolus:obolus, //eip3009)' > "$RUNNER_TEMP/somepath.txt"; then
            echo "::error::Could not evaluate the dependency query; check the target labels."
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/somepath.txt" ]; then
            cat "$RUNNER_TEMP/somepath.txt"
            echo "::error::eip3009 has entered //obolus:obolus's dependency graph. The gateway delegates verification to a facilitator and carries no payment crypto — see AGENTS.md."
            exit 1
          fi
          echo "No path from //obolus:obolus to //eip3009."

      # The canonical build. Every test here is hermetic — no network, no chain, no model — so this
      # is the gate that decides a merge; anything touching external reality runs outside it.
      - name: Test
        run: bazel test //...

  # The same canonical build, on the other platform this repository publishes for. `release.yml`'s
  # publish job is `needs: build`, so one red matrix row skips it and that commit publishes nothing.
  # Today that is discoverable only after the merge; this job surfaces the same break on the pull
  # request.
  #
  # Default configuration rather than `--config=release`, deliberately, and the difference cuts both
  # ways. At `opt-level=0` rustc enables debug assertions and overflow checks follow them, so the
  # arithmetic behaviour the release config sets explicitly is already exercised here — but at
  # `opt-level=3` debug assertions default off, so third-party `debug_assert!`s that run here are
  # compiled out of what ships. No configuration of this job reaches what the release does *after*
  # building, either: `cquery`, `cp` and a `file` check are shell against platform tools, which no
  # test target reaches. Closing that gap means running the release matrix before merge, which
  # `release.yml`'s trigger comment argues against.
  #
  # Linux arm64 is the release matrix's third runner and is not duplicated here. A broken row costs
  # the same whichever row it is, so this is a judgement about likelihood, not cost: with this job
  # CI covers (x86_64, Linux) and — `macos-latest` being Apple Silicon — (aarch64, Darwin). The one
  # ungated row is aarch64 Linux, whose residual risk is the interaction of an architecture this job
  # exercises with an OS the job above already does.
  bazel-macos:
    name: bazel test //... (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          # The action's cache key carries the platform, so this shares the `CI` cache name with the
          # job above without sharing its contents. At the version pinned above the key carries
          # platform only, not architecture — which costs nothing here, where the two jobs differ by
          # platform. Later versions key on both, so re-read this when the pin moves.
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Test
        run: bazel test //...

  cargo:
    name: cargo test --workspace --locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The cargo half of the `eip3009` invariant the bazel job checks above, and the half that
      # matters more: cargo declares dependencies per package, so an `eip3009` entry in
      # obolus/Cargo.toml would put signature verification in the gateway's own graph — the
      # constraint that forced the dev seller into its own package rather than a second binary
      # beside the gateway. `--edges normal` keeps only normal dependencies — it excludes both dev-
      # and build-dependencies, neither of which ships in the gateway binary. `cargo tree` also resolves
      # for the host target only; the bazel `somepath` query above is configuration-agnostic and sees
      # every `select()` branch, so together the two halves also cover a dependency a target-gated `cfg`
      # would hide from this one.
      #
      # The probe and the match are separate steps, as in the bazel job: piped straight into grep, a
      # `cargo tree` that cannot run — a stale lockfile, say — hands grep nothing, the pipeline fails,
      # the `if` is false, and the step reports a clean tree. And the match is "grep found it", not a
      # count: `grep -c` exits non-zero on a count of zero, which is the passing case. The pattern anchors
      # on a dependency node — line start or a space, then `eip3009 v<version>` — so it matches the crate
      # where `cargo tree` lists it, not the string `eip3009` in the checkout path the tool prints on its
      # root line.
      - name: eip3009 is not a gateway dependency
        run: |
          if ! cargo tree --package obolus --edges normal --locked > "$RUNNER_TEMP/obolus-tree.txt"; then
            echo "::error::Could not build the obolus dependency tree; is Cargo.lock current?"
            exit 1
          fi
          if grep -E '(^|[[:space:]])eip3009 v[0-9]' "$RUNNER_TEMP/obolus-tree.txt"; then
            echo "::error::eip3009 has entered the obolus package's dependency graph. The gateway delegates verification to a facilitator and carries no payment crypto — see AGENTS.md."
            exit 1
          fi
          echo "obolus's normal dependency graph is free of eip3009."

      # The other half of the dual build. Bazel above is canonical and cargo is the ergonomic path,
      # but AGENTS.md names both as merge gates, so both run here rather than one of them running
      # only on whichever machine a contributor happens to use. Both resolve their dependencies from
      # the same Cargo.lock, so a dependency-level disagreement between them is a real defect.
      #
      # The toolchains are deliberately NOT pinned together: MODULE.bazel fixes Rust 1.90.0, and this
      # job takes whatever stable the runner ships. Pinning a second version here would only prove
      # the pin agrees with itself. The cost of that choice is worth stating plainly — a failure here
      # that the Bazel job does not see may be a compiler difference rather than a defect, because
      # `--locked` holds the dependency graph fixed and says nothing about the compiler.
      - name: Test
        run: cargo test --workspace --locked
