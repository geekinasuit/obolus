name: CI

on:
  push:
    branches: [main]
  pull_request:

# This repository is public, so pull requests carry code from people we do not know. Every job
# below runs on a GitHub-hosted runner — never a self-hosted one, which would execute a stranger's
# patch on our own hardware — and the token is read-only.
permissions:
  contents: read

jobs:
  no-stray-notes:
    name: No working notes in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Content that cannot be a public issue — session handoffs and the like — is kept outside this
      # repository. .gitignore keeps it out by default; this job is what makes that load-bearing,
      # since an ignore rule is silently defeated by `git add -f`.
      - name: Reject committed notes
        run: |
          if git ls-files | grep -E '(^|/)thoughts/'; then
            echo "::error::Working notes must not be committed to this repository."
            exit 1
          fi
          echo "No note files tracked."

      # The subtler case: a path that is not in this repository but is still linked to. Such a link
      # is a broken reference for anyone reading the code. The pattern covers the whole directory
      # rather than one subtree of it, and requires a character after the slash so that naming the
      # directory itself — as AGENTS.md does — stays allowed. It is a reference *into* it that
      # breaks.
      - name: Reject references to absent note paths
        run: |
          if git grep -nE '(\.\./)*thoughts/[A-Za-z0-9_.-]' -- . ':!.github/workflows/ci.yml' ':!.gitignore'; then
            echo "::error::Source refers to a path that is not in this repository. Cite the GitHub issue instead — AGENTS.md gives the citation form for the kind of file you are in — or drop the reference entirely; content that cannot be public does not become an issue."
            exit 1
          fi
          echo "No references to absent note paths."

  bazel:
    name: bazel test //...
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # The canonical build. Every test here is hermetic — no network, no chain, no model — so this
      # is the gate that decides a merge; anything touching external reality runs outside it.
      - name: Test
        run: bazel test //...

  # The same canonical build, on the other platform this repository publishes for. `release.yml`'s
  # publish job is `needs: build`, so one red matrix row skips it and that commit publishes nothing.
  # Today that is discoverable only after the merge; this job surfaces the same break on the pull
  # request.
  #
  # Default configuration rather than `--config=release`, deliberately, and the difference cuts both
  # ways. At `opt-level=0` rustc enables debug assertions and overflow checks follow them, so the
  # arithmetic behaviour the release config sets explicitly is already exercised here — but at
  # `opt-level=3` debug assertions default off, so third-party `debug_assert!`s that run here are
  # compiled out of what ships. No configuration of this job reaches what the release does *after*
  # building, either: `cquery`, `cp` and a `file` check are shell against platform tools, which no
  # test target reaches. Closing that gap means running the release matrix before merge, which
  # `release.yml`'s trigger comment argues against.
  #
  # Linux arm64 is the release matrix's third runner and is not duplicated here. A broken row costs
  # the same whichever row it is, so this is a judgement about likelihood, not cost: with this job
  # CI covers (x86_64, Linux) and — `macos-latest` being Apple Silicon — (aarch64, Darwin). The one
  # ungated row is aarch64 Linux, whose residual risk is the interaction of an architecture this job
  # exercises with an OS the job above already does.
  bazel-macos:
    name: bazel test //... (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          # The action's cache key carries the platform, so this shares the `CI` cache name with the
          # job above without sharing its contents. At the version pinned above the key carries
          # platform only, not architecture — which costs nothing here, where the two jobs differ by
          # platform. Later versions key on both, so re-read this when the pin moves.
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Test
        run: bazel test //...

  cargo:
    name: cargo test --workspace --locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The other half of the dual build. Bazel above is canonical and cargo is the ergonomic path,
      # but AGENTS.md names both as merge gates, so both run here rather than one of them running
      # only on whichever machine a contributor happens to use. Both resolve their dependencies from
      # the same Cargo.lock, so a dependency-level disagreement between them is a real defect.
      #
      # The toolchains are deliberately NOT pinned together: MODULE.bazel fixes Rust 1.90.0, and this
      # job takes whatever stable the runner ships. Pinning a second version here would only prove
      # the pin agrees with itself. The cost of that choice is worth stating plainly — a failure here
      # that the Bazel job does not see may be a compiler difference rather than a defect, because
      # `--locked` holds the dependency graph fixed and says nothing about the compiler.
      - name: Test
        run: cargo test --workspace --locked
