[package]
name = "obolus"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
jsonwebtoken = "9"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
# Mints a throwaway Ed25519 keypair per test run so no private key is committed. Pinned to the
# version jsonwebtoken already resolves, so the graph keeps one copy rather than two.
ring = "0.17"
tower = { version = "0.5", features = ["util"] }
