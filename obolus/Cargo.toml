[package]
name = "obolus"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# Outbound TLS to the facilitator (#35). Default features off on all three, so nothing pulls in
# aws-lc-rs (a C build) or the OS trust store: the crypto is ring, which jsonwebtoken already
# builds, and the trust anchors are the compiled-in Mozilla set from webpki-roots. See `tls.rs`.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
jsonwebtoken = "9"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
# Mints a throwaway Ed25519 keypair per test run so no private key is committed. Pinned to the
# version jsonwebtoken already resolves, so the graph keeps one copy rather than two.
ring = "0.17"
tower = { version = "0.5", features = ["util"] }
# A throwaway CA and server certificate per test run, and the TLS server the facilitator tests
# connect to, so the trusted, untrusted and wrong-name cases run offline against a real handshake.
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "service", "http1", "tokio"] }
